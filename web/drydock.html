<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Dock - Warship Gunner 2 Compendium</title>
<style>
:root{--bg:#0a101c;--panel:#111a2b;--line:#2a3a55;--text:#dbe6f5;--muted:#8aa0bd;--accent:#5cc8ff}
@media (prefers-color-scheme:light){:root{--bg:#f3f6fa;--panel:#fff;--line:#c9d3e0;--text:#16202e;--muted:#5a6b82;--accent:#0a6fb5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 6px}
p.note{color:var(--muted);margin:0 0 12px;max-width:95ch}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer} button:hover{border-color:var(--accent)} button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
label{color:var(--muted)}
#stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#cv{display:block;width:100%;height:min(72vh,680px);touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
</style>
</head>
<body>
<script src="nav.js"></script>
<main>
  <h1>Floating dock (Skidbladnir)</h1>
  <p class="note">Skidbladnir, the player's floating dock.</p>
  <div class="bar">
    <label>Dock <select id="dock"></select></label>
    <button id="water" aria-pressed="true">Water</button>
    <label title="Time of day, 24-hour clock: type HH:MM (or just the hour, e.g. 20, or 2030) and press Enter. Everything derived from the clock is the game's data, see notes/weather.md">Time <input id="clkt" type="text" value="12:00" size="5" maxlength="5" placeholder="HH:MM" inputmode="numeric" style="width:5em;text-align:center"><input id="clk" type="hidden" value="720"> <span id="clkv" style="font-size:12px"></span></label>
    <label title="The game's 13 weather values (DAT 2). The names are MY reading of their parameters (palette set, rain / particle counts, mist density, lightning code); which weather the dock screen uses is NOT decoded">Weather <select id="wth"><option value="0">clear</option><option value="1">clear (variant)</option><option value="2">light cloud</option><option value="3">overcast</option><option value="4">overcast + lightning</option><option value="5">light rain</option><option value="6">rain</option><option value="7">heavy rain + lightning</option><option value="8">light mist</option><option value="9">mist</option><option value="10">thick mist</option><option value="11">snow?</option><option value="12">heavy snow?</option></select></label>
    <label title="Each mission's start time (mission script record kind 3, decoded) and the briefing's START label for it (decoded). Weather (decoded 2026-11-17): the stage weights are weather 0 for every mission, but six missions load an event script whose weather command sets another weather: MED_I_411 (later step: 12), EUR_J_483 (12), EUR_N_510 (later step: 7), FAR_C_660 Hell Atsche (8, mist), FAR_A_680 (11), ARC_Z_690 (11, later 4). The page applies the first weather such a script sets on load; whether the game shows it from the first frame or only when that event runs is not settled (see notes/weather.md)">Mission <select id="mis"><option value="">-</option></select></label>
    <label title="Decoded: the game's sky is a 2D gradient with colour stops at 60/40/25/10/0/-2/-4/-90 degrees elevation (phase colour slots 0-7), and its GS fog is linear from the camera to 'far' (weather float 3) in the horizon colour (slot 4)"><input type="checkbox" id="gsky" checked> game sky and fog</label>
    <label title="Decoded value, approximate use: the game's ambient light is (colour 0 + flash colour) x float 4 / 128; the page scales the dock and props by its brightness relative to clear noon (the renderer's real lighting maths is not reproduced)"><input type="checkbox" id="gdim" checked> game light level</label>
    <label title="Decoded per weather (DAT 2 records): effect type (rain 5-7, mist 8-10, slow particles = snow? 11-12), particle count (300 / 1000 / 3000 drops, 800 / 3000 flakes), particle colour and alpha (day and night records), fall speed ratio rain 1.0 : snow 0.2, lightning in weathers 4 and 7, fog 100 to 2 x 1980 during a flash. MY choices (not decoded): the size of the box the particles fill around the camera, the absolute fall speed, the streak length, the flake size and the time between flashes"><input type="checkbox" id="gfx" checked> weather effects</label>
    <label>Palette <select id="pal"></select></label>
    <input id="osz" type="hidden" value="10">
    <label>Brightness <input id="bri" type="range" min="0.6" max="3" step="0.05" value="1" style="vertical-align:middle;width:120px"></label>
    <button id="objs" aria-pressed="true" title="Props placed from the dock map's own placement table">Objects</button>
    <button id="lights" aria-pressed="false" title="Lamp glows and light beams (they are off during the day)">Lights</button>
    <label>Turn <select id="turn"><option value="0">0&deg;</option><option value="90">90&deg;</option><option value="180">180&deg;</option><option value="270">270&deg;</option></select></label>
    <button id="wire" aria-pressed="false">Wireframe</button>
    <button id="shot">Save picture</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="water.js?v=fog1"></script>
