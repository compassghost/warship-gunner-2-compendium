<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Part view</title>
<style>html,body{margin:0;height:100%;background:linear-gradient(#5b7fa6,#2c3f58);overflow:hidden;font:12px "Segoe UI",system-ui,sans-serif;color:#dbe6f5}canvas{display:block;width:100%;height:100%}#m{position:absolute;left:6px;bottom:4px;pointer-events:none}</style></head>
<body><canvas id="c"></canvas><div id="m"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* A small viewer for one game model (models/<id>.bin + .png, parts listed in models/index.json): it turns slowly; drag to turn it. Used by the design screen's cards (designer.html).
   It builds the model the way the Models page (models.html) does, so the two look the same: only the model's first part (the other parts are collision / level-of-detail meshes that overlap it and z-fight),
   the better diagonal for non-convex quads, grey faces where the model has no texture record, an sRGB texture, polygon offset, the same lights and the same camera range. Up is z (turned to y-up on screen). */
(function () {
  var cv = document.getElementById('c'), msg = document.getElementById('m'), ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true }), scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, 1, 200000);
  ren.setClearColor(0x000000, 0); scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6)); var dl = new THREE.DirectionalLight(0xffffff, 1.0); dl.position.set(1, 2, 1.5); scene.add(dl);
  var holder = new THREE.Group(), idx = null, cur = '', az = 0.8, el = 0.4, dist = 100, drag = null, spin = true;
  scene.add(holder);
  function resize() { var w = cv.clientWidth, h = cv.clientHeight; ren.setPixelRatio(window.devicePixelRatio || 1); ren.setSize(w, h, false); cam.aspect = w / Math.max(1, h); cam.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();
  function place() { cam.position.set(dist * Math.cos(el) * Math.sin(az), dist * Math.sin(el), dist * Math.cos(el) * Math.cos(az)); cam.lookAt(0, 0, 0); }
  function tex(id) { return new Promise(function (res) { new THREE.TextureLoader().load('models/' + id + '.png', function (t) { t.flipY = false; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, function () { res(null); }); }); }
  /* smooth by default (the model viewer's Smooth setting, key wg2.models.smooth): shared normals within 55 degrees */
  function smoothNormals(g) {
    var on = true; try { on = localStorage.getItem('wg2.models.smooth') !== '0'; } catch (e) {} if (!on) return;
    var P = g.attributes.position.array, nt = P.length / 9, fn = new Float32Array(nt * 3), key = new Array(nt * 3), at = new Map(), cosT = Math.cos(55 * Math.PI / 180), t, c, o;
    for (t = 0; t < nt; t++) {
      o = t * 9; var ux = P[o + 3] - P[o], uy = P[o + 4] - P[o + 1], uz = P[o + 5] - P[o + 2], vx = P[o + 6] - P[o], vy = P[o + 7] - P[o + 1], vz = P[o + 8] - P[o + 2];
      var x = uy * vz - uz * vy, y = uz * vx - ux * vz, z = ux * vy - uy * vx, l = Math.hypot(x, y, z) || 1; fn[t * 3] = x / l; fn[t * 3 + 1] = y / l; fn[t * 3 + 2] = z / l;
      for (c = 0; c < 3; c++) { var k = Math.round(P[o + c * 3] * 4) + ',' + Math.round(P[o + c * 3 + 1] * 4) + ',' + Math.round(P[o + c * 3 + 2] * 4); key[t * 3 + c] = k; var arr = at.get(k); if (!arr) at.set(k, arr = []); arr.push(t); }
    }
    var N = new Float32Array(P.length);
    for (t = 0; t < nt; t++) for (c = 0; c < 3; c++) {
      var sx = 0, sy = 0, sz = 0, a = t * 3, list = at.get(key[t * 3 + c]);
      for (var q = 0; q < list.length; q++) { var b = list[q] * 3; if (fn[a] * fn[b] + fn[a + 1] * fn[b + 1] + fn[a + 2] * fn[b + 2] >= cosT) { sx += fn[b]; sy += fn[b + 1]; sz += fn[b + 2]; } }
      var ln = Math.hypot(sx, sy, sz) || 1; o = t * 9 + c * 3; N[o] = sx / ln; N[o + 1] = sy / ln; N[o + 2] = sz / ln;
    }
    g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
  }
  async function load(id) {
    cur = id; while (holder.children.length) { var c = holder.children.pop(); if (c.geometry) c.geometry.dispose(); }
    if (!id) { msg.textContent = ''; return; }
    if (!idx) idx = await (await fetch('models/index.json')).json();
    var m = idx.find(function (x) { return x.id === id; }); if (!m) { msg.textContent = 'no model ' + id; return; }
    var buf = await (await fetch('models/' + id + '.bin')).arrayBuffer(), dv = new DataView(buf), p = m.parts[0], off = 0, nv = p.v, nq = p.q, V = new Float32Array(nv * 3), i;      /* the first part, at the start of the file */
    for (i = 0; i < nv * 3; i++) V[i] = dv.getFloat32(off + i * 4, true);
    var qo = off + nv * 12, uo = qo + nq * 8, pos = [], uv = [], col = [];
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; } function nrm(a, b, c) { var u = sub(b, a), v = sub(c, a); return [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]; } function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    for (var q = 0; q < nq; q++) {
      var q4 = [0, 1, 2, 3].map(function (j) { return dv.getUint16(qo + (q * 4 + j) * 2, true); }), U = [0, 1, 2, 3].map(function (j) { return [dv.getUint16(uo + (q * 8 + j * 2) * 2, true) / 16384, dv.getUint16(uo + (q * 8 + j * 2 + 1) * 2, true) / 16384]; });
      var tris = q4[2] === q4[3] ? [[0, 1, 2]] : [[0, 1, 2], [0, 2, 3]];
      if (q4[2] !== q4[3]) {      /* a non-convex quad leaves a hole with the wrong diagonal: pick the split whose two triangles face the same way */
        var P = q4.map(function (vi) { return [V[vi * 3], V[vi * 3 + 1], V[vi * 3 + 2]]; }), d1 = dot(nrm(P[0], P[1], P[2]), nrm(P[0], P[2], P[3])), d2 = dot(nrm(P[0], P[1], P[3]), nrm(P[1], P[2], P[3]));
        if (d2 > d1) tris = [[0, 1, 3], [1, 2, 3]];
      }
      var noUV = U.every(function (u) { return u[0] === 0 && u[1] === 0; }), g2 = noUV ? 0.7 : 1;      // faces without a texture record are grey
      tris.forEach(function (t) { t.forEach(function (c) { var vi = q4[c]; pos.push(V[vi * 3], V[vi * 3 + 1], V[vi * 3 + 2]); uv.push(U[c][0], U[c][1]); col.push(g2, g2, g2); }); });
    }
    if (id !== cur) return;
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals(); smoothNormals(g);
    var t = m.tex != null ? await tex(id) : null; if (id !== cur) return;
    var mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: t ? 0xffffff : 0x8fb4d8, map: t, vertexColors: true, metalness: 0.05, roughness: 0.8, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, transparent: !!t, alphaTest: t ? 0.4 : 0 }));
    g.computeBoundingBox(); var c0 = g.boundingBox.getCenter(new THREE.Vector3()); g.translate(-c0.x, -c0.y, -c0.z); g.computeBoundingSphere(); var radius = g.boundingSphere.center.length() + g.boundingSphere.radius;
    mesh.rotation.x = -Math.PI / 2; holder.add(mesh);      // z-up data, y-up screen
    cam.near = Math.max(0.5, radius * 0.02); cam.far = radius * 60; cam.updateProjectionMatrix(); dist = radius * 2.6; msg.textContent = '';
  }
  function go() { var id = decodeURIComponent(location.hash.replace(/^#/, '')); if (id !== cur) load(id).catch(function (e) { msg.textContent = String(e.message || e); }); }
  window.addEventListener('hashchange', go); go();
  cv.addEventListener('pointerdown', function (e) { drag = [e.clientX, e.clientY]; spin = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) { if (!drag) return; az -= (e.clientX - drag[0]) * 0.01; el = Math.max(-1.4, Math.min(1.4, el + (e.clientY - drag[1]) * 0.01)); drag = [e.clientX, e.clientY]; });
  cv.addEventListener('pointerup', function () { drag = null; });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); dist *= Math.exp(e.deltaY * 0.001); }, { passive: false });
  (function tick() { if (spin) az += 0.008; place(); ren.render(scene, cam); requestAnimationFrame(tick); })();
})();
</script></body></html>
