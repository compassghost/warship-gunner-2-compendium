<title>Warship Gunner 2 Compendium</title>

    resEl.replaceChildren(...hits.map(h => { const b = document.createElement('button'); b.type = 'button'; const a = document.createElement('span'); a.textContent = h.full; const s = document.createElement('small'); s.textContent = h.g; b.append(a, s); b.onclick = () => { resEl.hidden = true; goto(h.g, h.i); }; return b; }));
    if (!hits.length) { const p = document.createElement('div'); p.style.padding = '8px 10px'; p.textContent = 'No matches'; resEl.replaceChildren(p); }
    resEl.hidden = false;
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) resEl.hidden = true; });
  function setLayout(m) {
    mode = m; try { localStorage.setItem('wg2.layout', m); } catch (e) {}
    renderTabs();
    if (!inClass) { let keep = sel; const t = current && current.chips.find(c => c.i === keep); if (m === 'collapsed' && t && t.sub) keep = null; renderTree(); if (keep !== null && keep !== undefined) select(keep); }
  }
  document.getElementById('layStd').onclick = () => setLayout('standard');
  document.getElementById('layCmp').onclick = () => setLayout('compact');
  document.getElementById('layCol').onclick = () => setLayout('collapsed');
  renderTabs(); renderTree();
  // deep links: #GROUP:index opens a chip, #cls:Name opens a CLASSIFIED item
  function openHash() {
    let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    fromNav = true;
    try { openState(h); } finally { fromNav = false; }
  }
  function openState(h) {
    if (!h) {                                  // no hash = the page's starting state (reached by going Back to the first entry)
      if (cat !== 0 || grp !== 0 || sel !== null || inClass) { inClass = false; cat = 0; grp = 0; sel = null; renderTabs(); renderTree(); }
      return;
    }
    if (h === 'classified') { inClass = true; renderTabs(); renderClassified(); return; }
    let gi = -1, ci = -1; data.categories.forEach((cc, a) => cc.groups.forEach((gg, b) => { if (gg.name === h) { ci = a; gi = b; } }));
    if (gi >= 0) { inClass = false; cat = ci; grp = gi; sel = null; renderTabs(); renderTree(); return; }      // #GROUP alone opens a tree
    if (h.startsWith('cls:')) {
      const t = [...document.querySelectorAll('button.tab')].find(b => /^CLASSIFIED/.test(b.textContent.trim())); if (t) t.click();
      const it = classified && classified.sections.flatMap(s => s.items).find(i => i.name === h.slice(4)); if (it) showClassInfo(it);
    } else if (h.startsWith('sys:')) {      // guide-only system chip (High Gravity Shield, Ammo-Assembler), found by name
      for (const c of data.categories) for (const g of c.groups) { const ch = g.chips.find(x => x.extra && x.full === h.slice(4)); if (ch) { goto(g.name, ch.i); return; } }
    } else { const m = h.match(/^(.+):(\d+)$/); if (m) goto(m[1], +m[2]); }
  }
  window.addEventListener('hashchange', openHash); openHash();
})();
</script>
