<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ship Designer 3D - Warship Gunner 2 Compendium</title>
<style>
:root{--bg:#07142b;--ink:#e8f0ff;--dim:#7f9cc8;--accent:#53d6ff;--panel:#101f38}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050d1c;color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;display:block;width:100%;height:100%}
#bar{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:8px 12px;flex-wrap:wrap;background:linear-gradient(#050d1cee,#050d1c00);z-index:2}
.plate{background:linear-gradient(#8d949f,#5b616c);color:#dff6ff;font-weight:600;letter-spacing:.08em;padding:5px 22px 5px 14px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);text-shadow:0 1px 2px #000}
button,a.btn{background:var(--panel);color:var(--ink);border:1px solid #2b4a7e;border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer;text-decoration:none}
#clkL{color:var(--ink);font-size:14px}#clkt{width:4.6em;text-align:center;background:var(--panel);color:var(--ink);border:1px solid #2b4a7e;border-radius:4px;padding:5px 4px;font:inherit}.dim{opacity:.45}
select{background:var(--panel);color:var(--ink);border:1px solid #2b4a7e;border-radius:4px;padding:5px 8px;font:inherit}
button:hover,a.btn:hover{border-color:var(--accent)}
button.on{background:#1f4a86;border-color:var(--accent)}
#info{display:none;position:fixed;left:12px;bottom:12px;z-index:2;background:#0a1730dd;border:1px solid #2b4a7e;border-radius:6px;padding:8px 12px;font-size:13px;max-width:min(520px,92vw)}
#info b{color:var(--accent);font-weight:500}
#msg{position:fixed;left:0;right:0;top:50%;text-align:center;z-index:1;color:var(--dim);pointer-events:none}
#fade{position:fixed;inset:0;background:#000;z-index:1;pointer-events:none;opacity:1;transition:opacity 1.4s ease-out}
</style></head><body>
<canvas id="view"></canvas>
<div id="bar">
  <div class="plate">DESIGN VIEW 3D</div>
  <a class="btn" id="edit" href="designer.html" title="Open this build in the designer">Open in designer</a>
  <select id="port" title="Put the ship in one of the eight ports (the floating dock, DOCK00-07)"><option value="0">Port: none</option><option value="1">Port 1</option><option value="2">Port 2</option><option value="3">Port 3</option><option value="4">Port 4</option><option value="5">Port 5</option><option value="6">Port 6</option><option value="7">Port 7</option><option value="8">Port 8</option></select>
  <label id="clkL" title="Time of day in a port. The sky, fog, sea colour, light level and lamps follow the game's own clock data (as on the drydock page)">Time <select id="clkh"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option selected>12</option></select><select id="clkap"><option>AM</option><option selected>PM</option></select></label>
  <select id="wth" title="The game's 13 weathers (DAT 2)"><option value="0">Clear</option><option value="1">Clear (variant)</option><option value="2">Light cloud</option><option value="3">Overcast</option><option value="4">Overcast and lightning</option><option value="5">Light rain</option><option value="6">Rain</option><option value="7">Heavy rain and lightning</option><option value="8">Light mist</option><option value="9">Mist</option><option value="10">Thick mist</option><option value="11">Snow</option><option value="12">Heavy snow</option></select>
  <button id="bLights" title="Lamp glows and light beams of the port's lights (off by day)">Lights</button>
  <button id="bTop"title="Look straight down">Top</button>
  <button id="bSide" title="Look from the side">Side</button>
  <button id="bChase" title="Follow a flying aircraft over its shoulder (drag: swing round it, wheel: distance). Needs aircraft in the design">Chase cam</button>
  <label id="briL" title="Brightness of the whole picture: sky, sea, port, props, ship, parts and aircraft" style="color:var(--ink);font-size:14px">Brightness <input id="bri" type="range" min="0.5" max="2" step="0.05" value="1" style="vertical-align:middle;width:110px"></label>
  <button id="bShot"title="Save the view as a PNG picture">Screenshot</button>
  <button id="bReset" title="Reset the camera">Reset camera</button>
</div>
<div id="fade"></div>
<div id="msg">Loading...</div>
<div id="info"></div>
