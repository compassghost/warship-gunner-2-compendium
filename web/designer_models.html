<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ship Designer - Warship Gunner 2</title>
<style>
:root{--bg:#0b1d3a;--grid:#17335f;--ink:#e8f0ff;--dim:#7f9cc8;--accent:#53d6ff;--warn:#ffb347;--bad:#ff6b6b;--panel:#101f38}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050d1c;color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:1400px;margin:0 auto}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;flex-wrap:wrap}
.plate{background:linear-gradient(#8d949f,#5b616c);color:#dff6ff;font-weight:600;letter-spacing:.08em;padding:5px 22px 5px 14px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);text-shadow:0 1px 2px #000}
select,button,input{background:var(--panel);color:var(--ink);border:1px solid #2b4a7e;border-radius:4px;padding:5px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--accent)}button.on{background:#1f4a86;border-color:var(--accent)}
select{max-width:300px}
#stage{position:relative;flex:1;min-height:300px;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:none}
#mode{position:absolute;top:6px;left:0;right:0;text-align:center;color:#c9d6ea;letter-spacing:.12em;pointer-events:none}
#hud{display:grid;grid-template-columns:minmax(180px,1.1fr) 2fr 1.3fr;gap:0;background:#0a1730;border-top:2px solid #2b4a7e}
#hud>div{padding:8px 12px}
.hull{background:linear-gradient(#6c7380,#3a404b);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-style:italic;gap:8px}
.tag{background:#222a36;border-radius:3px;padding:1px 8px;font-style:normal;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:baseline}
.kv b{color:var(--accent);letter-spacing:.1em;font-weight:500}
.kv span{text-align:right;font-variant-numeric:tabular-nums}
.over{color:var(--bad)}.warn{color:var(--warn)}
#keys{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 12px;font-size:12px;color:var(--dim);background:#07112a}
#keys kbd{background:#1b2c4a;border:1px solid #34527f;border-radius:3px;padding:0 5px;color:var(--ink)}
#menu{position:absolute;top:0;right:0;bottom:0;width:min(380px,92%);background:rgba(8,18,38,.96);border-left:2px solid #2b4a7e;display:none;flex-direction:column;z-index:3}
#menu.open{display:flex}
#menu h3{margin:0;padding:10px 12px;font-weight:600;letter-spacing:.08em;border-bottom:1px solid #2b4a7e}
#menu .tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
#list{overflow:auto;padding:0 8px 12px;flex:1}
.item{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer}
.item:hover,.item.sel{background:#1b3563}
.item small{color:var(--dim)}
#note{padding:6px 12px;font-size:12px;color:var(--dim)}
details{padding:0 12px 6px;font-size:12px;color:var(--dim)}
details label{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
details input[type=range]{width:120px}
</style></head><body>
<div id="app">
<header>
  <div class="plate">CHANGE DESIGN</div>
  <select id="design" title="Load a pre-assembled design (the game's 435 defaults and 95 secret blueprints)"></select>
  <select id="hullSel" title="Change hull (parts stay where they are)"></select>
  <select id="setSel" title="Which of the game's model sets draws the parts"><option value="H">Models: dock (high detail)</option><option value="L">Models: in-game (low detail)</option></select>
  <select id="armorSel" title="Armor plating size"></select>
  <button id="btnClear">New</button>
  <button id="btnMenu">Menu (parts)</button>
  <button id="btnShare" title="Copy a link to this design">Copy link</button>
</header>
<div id="stage"><canvas id="cv"></canvas><div id="mode">EDITING PART</div>
  <div id="menu"><h3>PARTS</h3><div class="tabs" id="tabs"></div><div id="list"></div></div>
</div>
<details><summary>Hull fit (chosen, not decoded: 75 model units per cell, each hull centred on the x range of the game's own designs for it)</summary>
  <label>cell size <input id="fCell" type="range" min="40" max="130" value="75"><span id="vCell"></span></label>
  <label>hull shift <input id="fCx" type="range" min="40" max="100" value="70"><span id="vCx"></span></label>
  <label>deck row <input id="fRow" type="range" min="10" max="34" value="25"><span id="vRow"></span></label>
  <label><input type="checkbox" id="fFlip" checked> bow right (model faces -y)</label>
</details>
<div id="hud">
  <div class="hull"><span id="hName">-</span><span class="tag" id="hTag">-</span></div>
  <div class="kv" id="kv"></div>
  <div class="kv" id="kv2"></div>
</div>
<div id="keys">
  <span><kbd>Arrows</kbd> move cursor</span><span><kbd>Click</kbd>/<kbd>Space</kbd> place or grab</span><span><kbd>Del</kbd> delete</span>
  <span><kbd>Ctrl+Z</kbd> undo</span><span><kbd>M</kbd> menu</span><span><kbd>Tab</kbd> cursor speed</span><span><kbd>R</kbd> turn 180</span>
</div>
<div id="note"></div>
</div>
<script>

    var H = D.hulls[state.hull], lo = 160, hi = 0, any = false;
    state.mounts.forEach(function (m) {
      var p = D.parts[m[0]]; if (!p || !p.vital) return;
      var mi = p.mag && p.mag[m[5]], pi = p.pic && p.pic[barrelsOf(m) - 1], ms = shape(mi), ps = shape(pi); if (!ms || !ps) return;

  }
  function armorInfo() {      // armor weight = plating[idx] x 2 x VP / 100, x 80 / 100 when VP < 54 (core; full from 54)

  }
  function stats() {      // weight and speed (0x19bbe8, 530 / 530 stock designs)
    var H = D.hulls[state.hull], parts = 0, i;
    state.mounts.forEach(function (m) { var p = D.parts[m[0]]; if (p && p.wb4) parts += p.wb4[Math.min(5, barrelsOf(m) - 1)] || 0; });
    var ar = armorInfo(), weight = H.hwg + parts + state.sysW + ar.w + (state.x200 ? 200 : 0);

    var tf = tfHull(m, 'plan', F), hw = [], i; for (i = 0; i <= 150; i++) hw.push(-1);

    hs.onchange = function () { pushUndo(); state.hull = +hs.value; hullLayer = {}; refreshHull(); draw(); };
    $('btnClear').onclick = function () { pushUndo(); state.mounts = []; state.sel = -1; draw(); };
    var as = $('armorSel'); D.armorSize.forEach(function (cm, i) { var o = document.createElement('option'); o.value = i; o.textContent = cm ? 'Armor ' + cm + 'cm' : 'No armor'; as.appendChild(o); });
    as.onchange = function () { state.armorIdx = +as.value; draw(); };
    $('setSel').onchange = function () { state.set = $('setSel').value; loadModels(); draw(); };
    $('btnMenu').onclick = function () { $('menu').classList.toggle('open'); renderMenu(); };
    $('btnShare').onclick = function () { var u = link(); try { navigator.clipboard.writeText(u); } catch (e) {} location.hash = u.split('#')[1]; $('note').textContent = 'Link copied (and in the address bar).'; };
    ['fCell', 'fCx', 'fRow', 'fFlip'].forEach(function (id) { $(id).oninput = function () { $('vCell').textContent = $('fCell').value; $('vCx').textContent = $('fCx').value; $('vRow').textContent = $('fRow').value; hullLayer = {}; refreshHull(); loadModels(); draw(); }; });
    $('vCell').textContent = 75; $('vCx').textContent = 70; $('vRow').textContent = 25;
    buildPalette(); window.addEventListener('resize', resize);
    if (!fromHash()) setDesign(484);
    resize(); loadModels(); window.designer = { state: state, fit: fit, redraw: draw, stats: stats, vp: vp, collides: collides, vbox: vbox, setMS: function (v) { MS = v; }, setDZ: function (v) { DZ = v; }, getMS: function () { return MS; }, clamp: clampToHull, hw: hullHW, data: function () { return D; } };
  });
})();
